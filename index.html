<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04101f">
<title>大肥鱼 · 深渊宵夜</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#04101f;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    color:#eaf6ff;user-select:none;-webkit-user-select:none;touch-action:none}
  #game{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:none}
  #game:active{cursor:none}

  .rbtn{position:fixed;top:14px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(160,225,255,.28);
    background:rgba(10,40,70,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#bfe8ff;font-size:15px;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:30;
    transition:transform .12s ease,background .18s ease;padding:0}
  .rbtn:hover{background:rgba(20,70,115,.6)}
  .rbtn:active{transform:scale(.9)}
  #btnSound{right:66px}
  #btnPause{right:14px}
  .rbtn.off{color:#5d7f96;border-color:rgba(140,190,220,.16)}

  .screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    padding:22px;background:radial-gradient(120% 90% at 50% 0%,rgba(8,40,72,.72),rgba(2,8,18,.9));
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    animation:fade .35s ease both;overflow-y:auto}
  .screen.hidden{display:none}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  .card{width:min(440px,100%);text-align:center;padding:8px 4px 4px;
    display:flex;flex-direction:column;align-items:center;animation:rise .5s cubic-bezier(.2,.9,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  .avaWrap{position:relative;width:132px;height:132px;margin-bottom:12px}
  .avaWrap img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;
    border:2px solid rgba(150,225,255,.55);box-shadow:0 0 0 6px rgba(90,190,255,.09),0 14px 40px rgba(0,20,50,.6);
    animation:float 4.2s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1.5deg)}}
  .avaGlow{position:absolute;inset:-16px;border-radius:50%;z-index:-1;
    background:radial-gradient(circle,rgba(90,200,255,.35),transparent 68%);filter:blur(6px)}

  h1{margin:2px 0 6px;font-size:clamp(26px,7.4vw,34px);letter-spacing:1px;font-weight:800;line-height:1.25;
    background:linear-gradient(180deg,#ffffff,#9fdcff 62%,#5fb6ee);-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 18px rgba(40,140,220,.45))}
  h1 span{-webkit-text-fill-color:#63b6ec;font-weight:400;padding:0 3px;font-size:.72em;vertical-align:.08em}
  .tag{margin:0 0 16px;font-size:13.5px;color:#8fb8d4;letter-spacing:.6px}

  .how{list-style:none;padding:0;margin:0 0 20px;width:100%;display:flex;flex-direction:column;gap:8px}
  .how li{font-size:12.5px;line-height:1.55;color:#a9c9dd;background:rgba(120,200,255,.055);
    border:1px solid rgba(130,205,255,.11);border-radius:11px;padding:9px 12px;text-align:left}
  .how b{color:#7fd4ff;font-weight:700;margin-right:6px}

  .play{border:0;cursor:pointer;padding:15px 46px;border-radius:999px;font-size:17px;font-weight:800;letter-spacing:3px;
    color:#04223a;background:linear-gradient(180deg,#b6ecff,#57b8f0 55%,#3a97df);
    box-shadow:0 10px 28px rgba(45,150,225,.42),inset 0 1px 0 rgba(255,255,255,.75);
    transition:transform .12s ease,box-shadow .2s ease;font-family:inherit}
  .play:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(45,160,235,.55),inset 0 1px 0 rgba(255,255,255,.8)}
  .play:active{transform:translateY(1px) scale(.98)}
  .best{margin-top:16px;font-size:12px;color:#6f96ae;letter-spacing:.5px}
  .best b{color:#ffd48a;font-size:14px;font-weight:700;letter-spacing:0}

  /* game over */
  #over .big{font-size:clamp(22px,6.4vw,29px);font-weight:800;letter-spacing:1px;margin:0 0 4px;
    background:linear-gradient(180deg,#fff,#ffc9a8 70%,#ff9a76);-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent}
  #over .sub{font-size:12.5px;color:#8fb8d4;margin:0 0 18px}
  .stats{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:20px}
  .stat{background:rgba(120,200,255,.06);border:1px solid rgba(130,205,255,.12);border-radius:13px;padding:11px 8px}
  .stat i{display:block;font-style:normal;font-size:11px;color:#7fa5bd;letter-spacing:.5px;margin-bottom:3px}
  .stat b{font-size:19px;font-weight:800;color:#eaf8ff;letter-spacing:.5px}
  .stat b small{font-size:11px;font-weight:600;color:#8fc4e0;margin-left:2px}
  .rec{color:#ffd48a!important;animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.55}}

  #paused .card{animation:none}
  #paused h1{font-size:26px}
  .hint{margin-top:14px;font-size:11.5px;color:#5c8299;letter-spacing:.4px}
  @media (max-width:400px){.how li{font-size:12px;padding:8px 10px}}
  @media (max-height:620px){.avaWrap{width:96px;height:96px;margin-bottom:8px}.how{gap:6px;margin-bottom:14px}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<button id="btnSound" class="rbtn" title="声音">♪</button>
<button id="btnPause" class="rbtn" title="暂停">❚❚</button>

<div id="start" class="screen">
  <div class="card">
    <div class="avaWrap"><div class="avaGlow"></div><img id="ava" alt="大肥鱼"></div>
    <h1>大肥鱼<span>·</span>深渊宵夜</h1>
    <p class="tag">越吃越胖，越胖越难逃</p>
    <ul class="how">
      <li><b>游</b>鼠标／手指拖动指引方向，也可用 WASD 或方向键</li>
      <li><b>吸</b>按住不放张嘴吸水，小鱼小虾会被吸进嘴里</li>
      <li><b>躲</b>水母、大鱼、渔网、灯笼鱼——碰到就要吐出一身肉</li>
    </ul>
    <button id="btnStart" class="play">开吃</button>
    <div class="best">最胖记录 <b id="bestTxt">—</b></div>
  </div>
</div>

<div id="over" class="screen hidden">
  <div class="card">
    <div class="avaWrap" style="width:104px;height:104px"><div class="avaGlow"></div><img id="ava2" alt="大肥鱼"></div>
    <p class="big" id="overTitle">撑不住了</p>
    <p class="sub" id="overSub">大肥鱼到底还是被海吞掉了</p>
    <div class="stats">
      <div class="stat"><i>最终体重</i><b><span id="sWeight">0</span><small>kg</small></b></div>
      <div class="stat"><i>到达深度</i><b><span id="sDepth">0</span><small>m</small></b></div>
      <div class="stat"><i>吃下宵夜</i><b><span id="sEat">0</span><small>份</small></b></div>
      <div class="stat"><i>最胖记录</i><b id="sBest">0</b></div>
    </div>
    <button id="btnAgain" class="play">再吃一次</button>
    <div class="hint">按 R 立刻重开 · 按空格张嘴吸</div>
  </div>
</div>

<div id="paused" class="screen hidden">
  <div class="card">
    <h1>歇会儿</h1>
    <p class="tag">大肥鱼在海底翻着肚子等你</p>
    <button id="btnResume" class="play">继续</button>
    <div class="hint">按 P 或 Esc 继续</div>
  </div>
</div>

/* ══════════════ 小工具 ══════════════ */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[(Math.random() * arr.length) | 0];
const dist2 = (x1, y1, x2, y2) => { const dx = x1 - x2, dy = y1 - y2; return dx * dx + dy * dy; };

const _rgbCache = new Map();
function hex2rgb(h) {
  let c = _rgbCache.get(h);
  if (!c) {
    const n = parseInt(h.slice(1), 16);
    c = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    _rgbCache.set(h, c);
  }
  return c;
}
function mix(c1, c2, t) {
  const a = hex2rgb(c1), b = hex2rgb(c2);
  return `rgb(${Math.round(lerp(a[0], b[0], t))},${Math.round(lerp(a[1], b[1], t))},${Math.round(lerp(a[2], b[2], t))})`;
}
function rgba(hex, a) {
  const c = hex2rgb(hex);
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}

const cv = document.getElementById('game');
const ctx = cv.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1, UI = 1, SC = 1;
let rayCanvas = null;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = cv.clientWidth || window.innerWidth;
  H = cv.clientHeight || window.innerHeight;
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  UI = clamp(Math.min(W, H) / 720, 0.74, 1.16);
  SC = clamp(Math.min(W, H) / 720, 0.92, 1.6);
  buildRays();
  if (G.player) {
    G.player.x = clamp(G.player.x, 40, W - 40);
    G.player.y = clamp(G.player.y, 40, H - 40);
  }
}
function buildRays() {
  if (!W || !H) return;
  const c = document.createElement('canvas');
  c.width = Math.max(2, Math.round(W / 2));
  c.height = Math.max(2, Math.round(H / 2));
  const g = c.getContext('2d');
  const w = c.width, hh = c.height;
  try { g.filter = 'blur(7px)'; } catch (e) {}
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 6; i++) {
    const x = ((i + 0.5) / 6) * w + Math.sin(i * 2.1) * w * 0.03;
    const wid = w * (0.045 + 0.025 * Math.abs(Math.sin(i * 1.7)));
    const lg = g.createLinearGradient(x, 0, x + wid, hh);
    lg.addColorStop(0, 'rgba(150,228,255,0.5)');
    lg.addColorStop(0.42, 'rgba(128,205,255,0.2)');
    lg.addColorStop(1, 'rgba(110,190,255,0)');
    g.fillStyle = lg;
    g.beginPath();
    g.moveTo(x - wid * 0.5, -12);
    g.lineTo(x + wid * 0.5, -12);
    g.lineTo(x + wid * 2.4 + w * 0.05, hh + 12);
    g.lineTo(x + wid * 0.1, hh + 12);
    g.closePath();
    g.fill();
  }
  rayCanvas = c;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 80));

/* ══════════════ 声音（纯合成，无外部文件） ══════════════ */
const Sound = {
  ac: null, on: true, master: null,
  init() {
    if (this.ac) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ac = new AC();
      this.master = this.ac.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ac.destination);
    } catch (e) { this.ac = null; }
  },
  resume() { if (this.ac && this.ac.state === 'suspended') this.ac.resume(); },
  tone(f0, f1, dur, type, vol, delay) {
    if (!this.on || !this.ac) return;
    const t = this.ac.currentTime + (delay || 0);
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol == null ? 0.2 : vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, freq) {
    if (!this.on || !this.ac) return;
    const t = this.ac.currentTime;
    const len = Math.floor(this.ac.sampleRate * dur);
    const buf = this.ac.createBuffer(1, len, this.ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ac.createBufferSource(); src.buffer = buf;
    const flt = this.ac.createBiquadFilter(); flt.type = 'lowpass';
    flt.frequency.value = freq || 900;
    const g = this.ac.createGain(); g.gain.value = vol == null ? 0.18 : vol;
    src.connect(flt); flt.connect(g); g.connect(this.master);
    src.start(t);
  },
  eat(combo) {
    const f = 420 * Math.pow(1.0595, Math.min(combo, 12) * 2);
    this.tone(f, f * 1.5, 0.09, 'sine', 0.16);
    this.tone(f * 2, f * 2, 0.05, 'triangle', 0.05);
  },
  bigEat() { this.tone(180, 300, 0.16, 'sine', 0.2); this.tone(90, 60, 0.22, 'triangle', 0.1); },
  hurt() { this.tone(220, 60, 0.34, 'sawtooth', 0.13); this.noise(0.26, 0.16, 700); },
  levelUp() { [523, 659, 784].forEach((f, i) => this.tone(f, f, 0.16, 'triangle', 0.1, i * 0.07)); },
  over() { [392, 330, 262, 196].forEach((f, i) => this.tone(f, f * 0.98, 0.34, 'sine', 0.13, i * 0.14)); },
  suckLoop: null,
  startSuck() {
    if (!this.on || !this.ac || this.suckLoop) return;
    const o = this.ac.createOscillator(), g = this.ac.createGain(), flt = this.ac.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = 70;
    flt.type = 'lowpass'; flt.frequency.value = 420;
    g.gain.value = 0.0;
    g.gain.linearRampToValueAtTime(0.05, this.ac.currentTime + 0.12);
    o.connect(flt); flt.connect(g); g.connect(this.master); o.start();
    this.suckLoop = { o, g };
  },
  stopSuck() {
    if (!this.suckLoop) return;
    const { o, g } = this.suckLoop; this.suckLoop = null;
    const t = this.ac.currentTime;
    try {
      g.gain.cancelScheduledValues(t);
      g.gain.setValueAtTime(g.gain.value, t);
      g.gain.linearRampToValueAtTime(0, t + 0.1);
      o.stop(t + 0.14);
    } catch (e) {}
  }
};

/* ══════════════ 输入 ══════════════ */
const Input = {
  px: 0, py: 0, hasPointer: false, pointerType: 'mouse',
  down: false, sucking: false, keys: Object.create(null)
};

function pointerPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  Sound.init(); Sound.resume();
  const p = pointerPos(e);
  Input.px = p.x; Input.py = p.y;
  Input.hasPointer = true; Input.pointerType = e.pointerType;
  Input.down = true; Input.sucking = true;
  if (G.state === 'play') Sound.startSuck();
});
cv.addEventListener('pointermove', e => {
  const p = pointerPos(e);
  Input.px = p.x; Input.py = p.y;
  if (e.pointerType === 'mouse') { Input.hasPointer = true; Input.pointerType = 'mouse'; }
  else if (Input.down) { Input.hasPointer = true; Input.pointerType = e.pointerType; }
});
function endPointer(e) {
  Input.down = false;
  if (Input.sucking) { Input.sucking = false; Sound.stopSuck(); }
  if (e && e.pointerType !== 'mouse') Input.hasPointer = false;
}
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);
cv.addEventListener('contextmenu', e => e.preventDefault());

const KEYMAP = {
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right'
};
window.addEventListener('keydown', e => {
  if (KEYMAP[e.code]) { Input.keys[KEYMAP[e.code]] = true; Input.hasPointer = false; e.preventDefault(); }
  if (e.code === 'Space') {
    e.preventDefault();
    if (G.state === 'play') {
      if (!Input.sucking) { Sound.startSuck(); }
      Input.sucking = true;
    } else if (G.state === 'start') startGame();
    else if (G.state === 'over') startGame();
  }
  if (e.code === 'KeyR') { if (G.state !== 'play') { startGame(); } }
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
});
window.addEventListener('keyup', e => {
  if (KEYMAP[e.code]) Input.keys[KEYMAP[e.code]] = false;
  if (e.code === 'Space') { Input.sucking = false; Sound.stopSuck(); }
});

  bigfish:{ kind: 'hazard', r: 27, dmg: 1, from: 330, weight: 1.0, name: '大鱼' },
  angler: { kind: 'hazard', r: 22, dmg: 1, from: 720, weight: 1.0, name: '灯笼鱼' }
};
const FOODS = {
  plankton: { kind: 'food', r: 5,  w: 0.06, speed: 26,  flee: 40,  name: '浮游' },
  shrimp:   { kind: 'food', r: 8,  w: 0.17, speed: 46,  flee: 95,  name: '小虾' },
  fish:     { kind: 'food', r: 11, w: 0.34, speed: 62,  flee: 130, name: '小鱼' },
  pearl:    { kind: 'food', r: 8,  w: 1.25, speed: 34,  flee: 0,   name: '珍珠' }
};

/* ══════════════ 世界状态 ══════════════ */
const G = {
  state: 'start',
  time: 0, dt: 0,
  depth: 0, weight: START_W, depthMax: 0, peakW: START_W,
  combo: 1, comboT: 0, bestCombo: 1,
  eaten: 0, hp: 3, maxHp: 3,
  shake: 0, timeScale: 1, hitStop: 0,
  flash: 0, healFlash: 0,
  items: [], parts: [], texts: [], snow: [], bubbles: [], kelp: [],
  foodTimer: 0, hazardTimer: 0,
  unlocked: {}, toasts: [],
  player: null, best: 0, depthLv: 0
};

function loadBest() {
  let v = 0;
  try { v = parseFloat(localStorage.getItem(MAX_W_RECORD_KEY) || '0') || 0; } catch (e) {}
  G.best = v;
}
function saveBest(v) {
  if (v > G.best) { G.best = v; try { localStorage.setItem(MAX_W_RECORD_KEY, String(v.toFixed(1))); } catch (e) {} return true; }
  return false;
}

function initScenery() {
  G.snow = [];
  const n = Math.round(clamp(W * H / 14000, 40, 110));
  for (let i = 0; i < n; i++) {
    G.snow.push({
      x: Math.random() * W, y: Math.random() * H,
      r: rand(0.6, 2.1), sp: rand(4, 16), a: rand(0.12, 0.5), ph: rand(0, TAU)
    });
  }
  G.bubbles = [];
  for (let i = 0; i < 16; i++) {
    G.bubbles.push({ x: Math.random() * W, y: Math.random() * H, r: rand(1.5, 5), sp: rand(12, 32), wob: rand(0, TAU), a: rand(0.08, 0.3) });
  }
  G.kelp = [];
  const clusters = [{ x0: -10, span: W * 0.26 }, { x0: W * 0.74, span: W * 0.3 }];
  for (const c of clusters) {
    for (let i = 0; i < 9; i++) {
      G.kelp.push({
        x: c.x0 + (c.span * i) / 9 + rand(-8, 8),
        h: rand(0.16, 0.42), w: rand(5, 11), ph: rand(0, TAU), sp: rand(0.4, 0.9)
      });
    }
  }
}

function resetGame() {
  G.time = 0; G.depth = 0; G.depthMax = 0;
  G.weight = START_W; G.peakW = START_W;
  G.combo = 1; G.comboT = 0; G.bestCombo = 1;
  G.eaten = 0; G.hp = G.maxHp = 3;
  G.shake = 0; G.timeScale = 1; G.hitStop = 0; G.flash = 0;
  G.items.length = 0; G.parts.length = 0; G.texts.length = 0; G.toasts.length = 0;
  G.foodTimer = 0; G.hazardTimer = 2.2;
  G.unlocked = {};
  G.depthLv = 0;

  const r = radiusFor(START_W);
  G.player = {
    x: W / 2, y: H * 0.52, vx: 0, vy: 0, r,
    mouth: 0, blink: 0, blinkTimer: rand(1.5, 4),
    invuln: 0, hurt: 0, tailPh: 0, pop: 0, speed: 0,
    eatGlow: 0, bob: rand(0, TAU), facing: 1, tilt: 0, suckVis: 0
  };
  initScenery();
  // 开场先撒一批食物，玩家不会空等
  for (let i = 0; i < 14; i++) spawnFood(true);
  for (let i = 0; i < 3; i++) spawnFood(true);
}

/* ══════════════ 生成物 ══════════════ */
function edgePos(margin) {
  const side = randi(0, 3);
  const m = margin || 30;
  if (side === 0) return { x: rand(m, W - m), y: -m, vx: 0, vy: 1 };
  if (side === 1) return { x: W + m, y: rand(m, H - m), vx: -1, vy: 0 };
  if (side === 2) return { x: rand(m, W - m), y: H + m, vx: 0, vy: -1 };
  return { x: -m, y: rand(m, H - m), vx: 1, vy: 0 };
}

function foodPool() {
  const pool = [{ id: 'plankton', w: 5 }, { id: 'shrimp', w: 3.4 }, { id: 'fish', w: 2.3 }];
  if (G.depth > 260) pool[1].w += 1.2;
  if (G.depth > 520) pool[2].w += 1.4;
  return pool;
}

function spawnFood(anywhere) {
  const p = G.player;
  let id = 'plankton';
  const pool = foodPool();
  let total = pool.reduce((s, x) => s + x.w, 0), roll = Math.random() * total;
  for (const x of pool) { if (roll < x.w) { id = x.id; break; } roll -= x.w; }
  if (!anywhere && G.depth > 200 && Math.random() < 0.055) id = 'pearl';

  const T = FOODS[id];
  let x, y, vx = 0, vy = 0;
  if (anywhere) {
    let tries = 0;
    do {
      x = rand(40, W - 40); y = rand(50, H - 50); tries++;
    } while (p && dist2(x, y, p.x, p.y) < 150 * 150 && tries < 24);
  } else {
    const e = edgePos(40);
    x = e.x; y = e.y; vx = e.vx; vy = e.vy;
    const sp = T.speed * SC * rand(0.7, 1.25);
    vx = vx * sp + rand(-18, 18) * SC;
    vy = vy * sp + rand(-18, 18) * SC;
  }
  G.items.push({
    id, kind: 'food', x, y, vx, vy, r: T.r, w: T.w,
    ph: rand(0, TAU), age: 0, flash: 0, eaten: false,
    rot: rand(-0.4, 0.4), suck: 0
  });
  return G.items[G.items.length - 1];
}

function spawnHazard() {
  const pool = [];
  for (const k in HAZARDS) if (G.depth >= HAZARDS[k].from) pool.push(k);
  if (!pool.length) return;
  const id = pick(pool);
  const T = HAZARDS[id];
  const TR = T.r * SC;
  const p = G.player;

  if (id === 'net') {
    const x = rand(W * 0.1, W * 0.9);
    G.items.push({ id, kind: 'hazard', x, y: -50, vx: 0, vy: rand(52, 78) * SC, r: TR, ph: rand(0, TAU), age: 0, born: 0 });
    return;
  }
  if (id === 'jelly') {
    const e = edgePos(50);
    G.items.push({
      id, kind: 'hazard', x: e.x, y: e.y,
      vx: (e.vx * rand(20, 40) + rand(-14, 14)) * SC, vy: e.vy * rand(16, 34) * SC, r: TR,
      ph: rand(0, TAU), age: 0, pulse: rand(0, TAU)
    });
    return;
  }
  if (id === 'bigfish' || id === 'angler') {
    // 从离玩家较远的边出现
    let best = null, bd = -1;
    for (let i = 0; i < 6; i++) {
      const e = edgePos(70);
      const d = dist2(e.x, e.y, p.x, p.y);
      if (d > bd) { bd = d; best = e; }
    }
    const sp = (id === 'angler' ? rand(70, 95) : rand(58, 82)) * SC;
    G.items.push({
      id, kind: 'hazard', x: best.x, y: best.y,
      vx: best.vx * sp, vy: best.vy * sp, r: TR, ph: rand(0, TAU), age: 0,
      charge: 0, turn: 0, looking: 0
    });
  }
}

/* ══════════════ 特效 ══════════════ */
function burst(x, y, n, color, spd, life, size) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(spd * 0.25, spd);
    G.parts.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: life || rand(0.3, 0.7), max: life || 0.6,
      r: size || rand(1.4, 3.6), color
    });
  }
}
function floatText(x, y, txt, color, size) {
  G.texts.push({ x, y, txt, color: color || '#fff', life: 0.9, max: 0.9, size: size || 14, vy: -46, vx: rand(-8, 8) });
}
function toast(txt, color) {
  G.toasts.push({ txt, life: 2.6, max: 2.6, color: color || '#9fe3ff' });
  if (G.toasts.length > 3) G.toasts.shift();
}

/* ══════════════ 游戏逻辑 ══════════════ */
const FAT = () => clamp((G.player.r / SC - 23) / 30, 0, 1);

function updatePlayer(dt) {
  const p = G.player;
  const fat = FAT();
  const maxV = (355 - 145 * fat) * SC;

  let tx = null, ty = null;
  const k = Input.keys;
  let kx = 0, ky = 0;
  if (k.left) kx -= 1;
  if (k.right) kx += 1;
  if (k.up) ky -= 1;
  if (k.down) ky += 1;

  if (kx || ky) {
    const len = Math.hypot(kx, ky) || 1;
    tx = p.x + (kx / len) * 260;
    ty = p.y + (ky / len) * 260;
  } else if (Input.hasPointer) {
    tx = Input.px;
    ty = Input.py - (Input.pointerType === 'touch' || Input.pointerType === 'pen' ? 66 * SC : 0);
  }

  const suckK = Input.sucking ? 0.62 : 1;
  if (tx !== null) {
    const dx = tx - p.x, dy = ty - p.y;
    const d = Math.hypot(dx, dy);
    if (d > 2) {
      const target = Math.min(maxV * suckK, d * 7.5);
      const ax = (dx / d) * target, ay = (dy / d) * target;
      const acc = Math.min(1, dt * (d > 90 ? 7 : 11));
      p.vx = lerp(p.vx, ax, acc);
      p.vy = lerp(p.vy, ay, acc);
    } else {
      p.vx = lerp(p.vx, 0, Math.min(1, dt * 9));
      p.vy = lerp(p.vy, 0, Math.min(1, dt * 9));
    }
  } else {
    const drift = Math.sin(G.time * 0.7 + p.bob) * 8;
    p.vx = lerp(p.vx, drift, Math.min(1, dt * 1.6));
    p.vy = lerp(p.vy, Math.cos(G.time * 0.55 + p.bob) * 6, Math.min(1, dt * 1.6));
  }

  p.x += p.vx * dt;
  p.y += p.vy * dt;

  const m = p.r * 0.85;
  if (p.x < m) { p.x = m; p.vx = Math.abs(p.vx) * 0.3; }
  if (p.x > W - m) { p.x = W - m; p.vx = -Math.abs(p.vx) * 0.3; }
  if (p.y < m) { p.y = m; p.vy = Math.abs(p.vy) * 0.3; }
  if (p.y > H - m) { p.y = H - m; p.vy = -Math.abs(p.vy) * 0.3; }

  p.speed = Math.hypot(p.vx, p.vy);
  if (p.vx > 26) p.facing = 1; else if (p.vx < -26) p.facing = -1;
  p.tilt = lerp(p.tilt, clamp(p.vy / 900, -0.26, 0.26) + clamp(-p.vx * 0.0006, -0.08, 0.08) * 0, 0.12);

  p.tailPh += dt * (4 + p.speed * 0.032);

  // 游动时拖出一串泡泡
  if (p.speed > 165 && G.bubbles.length < 34 && Math.random() < dt * 16) {
    const back = p.facing > 0 ? -1 : 1;
    G.bubbles.push({
      x: p.x + back * p.r * 1.5 + rand(-4, 4), y: p.y + rand(-p.r * 0.4, p.r * 0.4),
      r: rand(1, 2.4), sp: rand(16, 34), wob: rand(0, TAU), a: rand(0.12, 0.26)
    });
  }

  p.mouth = lerp(p.mouth, Input.sucking ? 1 : 0, Math.min(1, dt * 12));
  p.suckVis = lerp(p.suckVis, Input.sucking ? 1 : 0, Math.min(1, dt * 8));

  p.blinkTimer -= dt;
  if (p.blinkTimer <= 0) { p.blink = 1; p.blinkTimer = rand(2.2, 6.5); }
  if (p.blink > 0) p.blink = Math.max(0, p.blink - dt * 6);

  if (p.invuln > 0) p.invuln = Math.max(0, p.invuln - dt);
  if (p.hurt > 0) p.hurt = Math.max(0, p.hurt - dt * 2.6);
  if (p.pop > 0) p.pop = Math.max(0, p.pop - dt * 7);
  if (p.eatGlow > 0) p.eatGlow = Math.max(0, p.eatGlow - dt * 3);

  // 体重 → 半径（平滑长大）
  const targetR = radiusFor(G.weight);
  p.r = lerp(p.r, targetR, Math.min(1, dt * 3.2));
}

function suckFood(dt) {
  if (!Input.sucking) return;
  const p = G.player;
  const R = suckR();
  const mouthX = p.x + Math.cos(p.tilt * 0.4) * p.r * 0.5 * 0;
  for (const it of G.items) {
    if (it.kind !== 'food' || it.eaten) continue;
    const dx = p.x - it.x, dy = p.y - it.y;
    const d = Math.hypot(dx, dy);
    if (d > R || d < 0.001) continue;
    const f = (1 - d / R);
    const pull = 240 + 3200 * f * f;
    it.vx += (dx / d) * pull * dt;
    it.vy += (dy / d) * pull * dt;
    it.suck = f;
    it.ph += dt * 18;
  }
}

function eat(it) {
  const p = G.player;
  it.eaten = true;
  const gainBase = it.w * (1 + 0.09 * (G.combo - 1));
  G.weight += gainBase;
  if (G.weight > G.peakW) G.peakW = G.weight;
  G.eaten++;
  const big = it.w >= 0.5;

  if (G.comboT > 0) G.combo = Math.min(12, G.combo + 1);
  else G.combo = 1;
  G.comboT = 2.4;
  G.bestCombo = Math.max(G.bestCombo, G.combo);

  p.pop = 0.55 + (big ? 0.35 : 0) + (it.id === 'pearl' ? 0.4 : 0);
  p.eatGlow = 1;

  if (it.id === 'pearl') {
    Sound.bigEat();
    burst(it.x, it.y, 16, '#fff3c4', 210, 0.7, 3);
    floatText(it.x, it.y - 12, '+' + gainBase.toFixed(1) + 'kg 珍珠!', '#ffe08a', 15);
    G.flash = Math.max(G.flash, 0.12);
  } else {
    Sound.eat(G.combo);
    burst(it.x, it.y, big ? 9 : 5, it.id === 'shrimp' ? '#ffc0b0' : '#bfe9ff', 130, 0.47, 2.4);
    if (G.combo > 1 || big) floatText(it.x, it.y - 8, '+' + gainBase.toFixed(1) + 'kg', '#cfeeff', big ? 14 : 12);
  }
  // 泡泡
  for (let i = 0; i < 4; i++) {
    G.bubbles.push({ x: p.x + rand(-8, 8), y: p.y + rand(-8, 8), r: rand(1.4, 3.6), sp: rand(28, 62), wob: rand(0, TAU), a: rand(0.2, 0.42) });
  }
}

function hit(it) {
  const p = G.player;
  if (p.invuln > 0) return;

  G.hp--;
  p.invuln = 1.7;
  p.hurt = 1;
  G.shake = Math.max(G.shake, 15);
  G.hitStop = 0.09;
  G.flash = 0.55;

  const lost = (G.weight - START_W) * 0.3 + 1.4;
  G.weight = Math.max(START_W, G.weight - lost);
  p.r = Math.max(radiusFor(START_W), p.r - 3);

  G.combo = 1; G.comboT = 0;

  Sound.hurt();
  burst(p.x, p.y, 22, '#8fd6ff', 260, 0.75, 3.4);
  floatText(p.x, p.y - p.r - 10, '-' + lost.toFixed(1) + 'kg', '#ff9f9f', 16);

  // 弹开
  const dx = p.x - it.x, dy = p.y - it.y, d = Math.hypot(dx, dy) || 1;
  p.vx += (dx / d) * 320 * SC;
  p.vy += (dy / d) * 320 * SC;
  it.vx -= (dx / d) * 60 * SC;
  it.vy -= (dy / d) * 60 * SC;

  if (G.hp <= 0) gameOver();
}

function updateItems(dt) {
  const p = G.player;
  for (let i = G.items.length - 1; i >= 0; i--) {
    const it = G.items[i];
    it.age += dt;
    if (it.flash) it.flash = Math.max(0, it.flash - dt * 3);

    if (it.kind === 'food') {
      // 躲人
      const T = FOODS[it.id];
      const dx = it.x - p.x, dy = it.y - p.y;
      const d = Math.hypot(dx, dy) || 1;
      const fleeR = 150 * SC;
      if (T.flee && d < fleeR && it.age > 0.4 && !Input.sucking) {
        const f = (1 - d / fleeR) * T.flee * 5 * SC;
        it.vx += (dx / d) * f * dt;
        it.vy += (dy / d) * f * dt;
      }
      // 漂移
      it.ph += dt * 1.6;
      it.vx += Math.cos(it.ph) * 14 * dt;
      it.vy += Math.sin(it.ph * 1.3 + 1) * 14 * dt;
      // 阻尼
      const damp = Math.pow(0.965, dt * 60);
      it.vx *= damp; it.vy *= damp;
      const sp = Math.hypot(it.vx, it.vy);
      const cap = it.suck > 0 ? 1900 * SC : T.speed * 2.6 * SC;
      if (sp > cap) { it.vx = it.vx / sp * cap; it.vy = it.vy / sp * cap; }
      it.suck = Math.max(0, it.suck - dt * 2.5);

      it.x += it.vx * dt; it.y += it.vy * dt;

      // 边界回收
      const mg = 90 * SC;
      if (it.x < -mg || it.x > W + mg || it.y < -mg || it.y > H + mg) {
        G.items.splice(i, 1);
        continue;
      }
      // 被吃
      const er = p.r * 0.92 + it.r * 0.55;
      if (dist2(it.x, it.y, p.x, p.y) < er * er) { eat(it); G.items.splice(i, 1); continue; }
    } else {
      updateHazard(it, dt, i);
      if (it.dead) { G.items.splice(i, 1); continue; }
    }
  }
}

function updateHazard(it, dt, idx) {
  const p = G.player;
  it.ph += dt;
  if (it.age > 30) { it.dead = true; return; }

  if (it.id === 'jelly') {
    it.pulse = (it.pulse || 0) + dt * 1.7;
    const pulse = Math.sin(it.pulse);
    it.vx += Math.cos(it.ph * 0.7) * 18 * dt;
    it.vy += Math.sin(it.ph * 0.9) * 14 * dt + pulse * 12 * dt;
    it.vx *= Math.pow(0.98, dt * 60);
    it.vy *= Math.pow(0.98, dt * 60);
    it.x += it.vx * dt; it.y += it.vy * dt;
    if (it.x < -140 * SC || it.x > W + 140 * SC || it.y < -140 * SC || it.y > H + 140 * SC) { it.dead = true; return; }

    // 胖到极致可以把水母一起吃掉
    if (p.r > it.r * 2.05) {
      const er = p.r * 0.8 + it.r * 0.4;
      if (dist2(it.x, it.y, p.x, p.y) < er * er) {
        G.weight += 1.6 + 0.1 * G.combo;
        G.eaten++;
        p.pop = 1; p.eatGlow = 1;
        Sound.bigEat();
        burst(it.x, it.y, 20, '#ffb7f0', 240, 0.8, 3);
        floatText(it.x, it.y - 12, '水母也吃掉！', '#ffc8f5', 14);
        it.dead = true;
        return;
      }
    }
  } else if (it.id === 'net') {
    it.y += it.vy * dt;
    it.x += Math.sin(it.age * 1.1) * 22 * dt;
    if (it.y > H + 70) { it.dead = true; return; }
  } else if (it.id === 'bigfish' || it.id === 'angler') {
    const dx = p.x - it.x, dy = p.y - it.y;
    const d = Math.hypot(dx, dy) || 1;
    const speed = (it.id === 'angler' ? 118 : 96) * SC;
    const range = (it.id === 'angler' ? 620 : 470) * SC;
    if (d < range) {
      it.looking = 1;
      const k = (1 - d / range) * 2.2 + 0.6;
      it.vx += (dx / d) * speed * k * dt;
      it.vy += (dy / d) * speed * k * dt;
    } else {
      it.looking = 0;
      it.vx += Math.cos(it.ph * 0.8) * 26 * SC * dt;
      it.vy += Math.sin(it.ph * 1.1) * 26 * SC * dt;
    }
    const sp = Math.hypot(it.vx, it.vy);
    const cap = speed * 1.12;
    if (sp > cap) { it.vx = it.vx / sp * cap; it.vy = it.vy / sp * cap; }
    it.x += it.vx * dt; it.y += it.vy * dt;
    // 缓慢转向玩家所在方向（视觉）
    if (sp > 6) it.dir = Math.atan2(it.vy, it.vx);

    const mg = 130 * SC;
    if (it.x < -mg || it.x > W + mg || it.y < -mg || it.y > H + mg) {
      // 追击中不让它跑掉太容易
      if (it.looking) { it.x = clamp(it.x, -60, W + 60); it.y = clamp(it.y, -60, H + 60); }
      else if (it.age > 2) { it.dead = true; return; }
    }
  }

  // 碰到就受伤
  const rr = p.r * 0.62 + it.r * 0.72;
  if (dist2(it.x, it.y, p.x, p.y) < rr * rr) hit(it);
}

function updateParticles(dt) {
  for (let i = G.parts.length - 1; i >= 0; i--) {
    const q = G.parts[i];
    q.life -= dt;
    if (q.life <= 0) { G.parts.splice(i, 1); continue; }
    q.x += q.vx * dt; q.y += q.vy * dt;
    q.vx *= Math.pow(0.94, dt * 60);
    q.vy *= Math.pow(0.94, dt * 60);
    q.vy -= 12 * dt;
  }
  for (let i = G.texts.length - 1; i >= 0; i--) {
    const t = G.texts[i];
    t.life -= dt;
    if (t.life <= 0) { G.texts.splice(i, 1); continue; }
    t.x += t.vx * dt; t.y += t.vy * dt;
    t.vy *= Math.pow(0.96, dt * 60);
  }
  for (let i = G.toasts.length - 1; i >= 0; i--) {
    G.toasts[i].life -= dt;
    if (G.toasts[i].life <= 0) G.toasts.splice(i, 1);
  }
  for (const s of G.snow) {
    s.y -= s.sp * dt;
    s.x += Math.sin(G.time * 0.5 + s.ph) * 4 * dt;
    if (s.y < -6) { s.y = H + 6; s.x = Math.random() * W; }
  }
  for (let i = G.bubbles.length - 1; i >= 0; i--) {
    const b = G.bubbles[i];
    b.y -= b.sp * dt;
    b.x += Math.sin(G.time * 2 + b.wob) * 10 * dt;
    if (b.y < -10) { if (G.bubbles.length > 26) G.bubbles.splice(i, 1); else { b.y = H + 8; b.x = Math.random() * W; } }
  }
}

function updateSpawn(dt) {
  G.foodTimer -= dt;
  if (G.foodTimer <= 0) {
    G.foodTimer = 0.26;
    let n = 0;
    for (const it of G.items) if (it.kind === 'food') n++;
    const areaK = clamp(W * H / (400 * 820), 0.55, 3.2);
    const want = Math.round((18 + Math.min(10, Math.floor(G.depth / 220))) * areaK);
    if (n < want) spawnFood(false);
  }
  G.hazardTimer -= dt;
  if (G.hazardTimer <= 0) {
    G.hazardTimer = Math.max(1.15, 3.6 - G.depth / 420) * rand(0.85, 1.3);
    let n = 0;
    for (const it of G.items) if (it.kind === 'hazard') n++;
    const cap = Math.min(7, 2 + Math.floor(G.depth / 240));
    if (n < cap && G.time > 5.5) spawnHazard();
  }
}

function updateUnlocks() {
  const list = [
    [110, 'net', '⚠ 渔网从上面沉下来了'],
    [330, 'bigfish', '⚠ 有大鱼在盯着你'],
    [720, 'angler', '⚠ 灯亮了……有东西在下面']
  ];
  for (const [dep, id, msg] of list) {
    if (G.depth >= dep && !G.unlocked[id]) {
      G.unlocked[id] = true;
      toast(msg, '#ffcf8a');
      G.flash = Math.max(G.flash, 0.3);
      Sound.levelUp();
    }
  }
}

function update(dt) {
  G.time += dt;
  const p = G.player;

  updatePlayer(dt);
  suckFood(dt);
  updateItems(dt);
  updateSpawn(dt);
  updateParticles(dt);
  updateUnlocks();

  // 深度
  const spd = Math.hypot(p.vx, p.vy);
  G.depth += dt * (5 + spd * 0.055);
  if (G.depth > G.depthMax) G.depthMax = G.depth;

  // 连击计时
  if (G.comboT > 0) {
    G.comboT -= dt;
    if (G.comboT <= 0) G.combo = 1;
  }

  // 镜头 / 闪光
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 55);
  if (G.flash > 0) G.flash = Math.max(0, G.flash - dt * 2.6);

  // 每 200m 变胖提醒
  const lv = Math.floor(G.depthMax / 200);
  if (lv > G.depthLv) {
    G.depthLv = lv;
    if (lv > 1) toast(`${lv * 200}m · 更深了`, '#8fd8ff');
  }
}

/* ══════════════ 绘制：背景 ══════════════ */
function drawBackground() {
  const dark = clamp(G.depth / 1500, 0, 1);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, mix('#1c6193', '#052440', dark));
  g.addColorStop(0.45, mix('#124a72', '#03182c', dark));
  g.addColorStop(1, mix('#0a3253', '#010810', dark));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 水面光晕
  const sky = ctx.createRadialGradient(W * 0.5, -H * 0.12, 10, W * 0.5, -H * 0.12, H * 0.95);
  sky.addColorStop(0, `rgba(150,225,255,${0.32 * (1 - dark)})`);
  sky.addColorStop(0.45, `rgba(90,180,235,${0.09 * (1 - dark)})`);
  sky.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // 光柱（预渲染柔光层，避免多边形硬边）
  if (dark < 0.96 && rayCanvas) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = (1 - dark) * 0.92;
    ctx.drawImage(rayCanvas, Math.sin(G.time * 0.17) * 16, 0, W, H);
    ctx.restore();
  }

  // 远海草
  const kelpA = 0.1 + 0.16 * (1 - dark);
  ctx.save();
  for (const k of G.kelp) {
    const h = H * k.h;
    const sway = Math.sin(G.time * k.sp + k.ph) * (10 + 12 * k.h * 6);
    ctx.beginPath();
    ctx.moveTo(k.x - k.w * 0.5, H + 10);
    ctx.quadraticCurveTo(k.x - k.w * 0.5 + sway * 0.5, H - h * 0.55, k.x + sway, H - h);
    ctx.quadraticCurveTo(k.x + k.w * 0.7 + sway * 0.6, H - h * 0.5, k.x + k.w * 0.6, H + 10);
    ctx.closePath();
    ctx.fillStyle = `rgba(20,${Math.round(90 + 40 * (1 - dark))},${Math.round(110 + 30 * (1 - dark))},${kelpA})`;
    ctx.fill();
  }
  ctx.restore();

  // 海底雾
  const fog = ctx.createLinearGradient(0, H * 0.55, 0, H);
  fog.addColorStop(0, 'rgba(0,0,0,0)');
  fog.addColorStop(1, `rgba(0,6,16,${0.3 + 0.3 * dark})`);
  ctx.fillStyle = fog;
  ctx.fillRect(0, H * 0.55, W, H * 0.45);
}

function drawSnow() {
  ctx.save();
  for (const s of G.snow) {
    ctx.globalAlpha = s.a * (0.6 + 0.4 * Math.sin(G.time * 1.4 + s.ph));
    ctx.fillStyle = '#dff4ff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function drawBubbles() {
  ctx.save();
  for (const b of G.bubbles) {
    ctx.globalAlpha = b.a;
    ctx.strokeStyle = 'rgba(210,245,255,0.85)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, TAU);
    ctx.stroke();
    ctx.globalAlpha = b.a * 0.55;
    ctx.fillStyle = 'rgba(180,235,255,0.5)';
    ctx.beginPath();
    ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.32, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

/* ══════════════ 绘制：大肥鱼 ══════════════ */
function drawDafeiyu(p) {
  const r = p.r;
  const blink = clamp(p.blink, 0, 1);
  const mouth = p.mouth;
  const pop = p.pop;
  const hurt = p.hurt;
  const suck = p.suckVis;

  const HAIR = '#4278dc', HAIR_D = '#2c53b6', HAIR_L = '#9cc9fa';
  const SKIN = '#ffe9dd';

  const cx = r * 0.30, cy = r * 0.01;
  const hrx = r * 0.62, hry = r * 0.60;

  ctx.save();
  ctx.translate(p.x, p.y);
  if (p.invuln > 0 && Math.floor(p.invuln * 14) % 2 === 0) ctx.globalAlpha = 0.42;
  ctx.rotate(p.tilt);
  ctx.scale(p.facing, 1);
  ctx.scale(1 + pop * 0.13, 1 - pop * 0.09);

  /* 1. 飘在后面的长发 */
  ctx.save();
  ctx.strokeStyle = HAIR_D;
  ctx.lineCap = 'round';
  for (let i = 0; i < 2; i++) {
    const dir = i === 0 ? -1 : 1;
    const ph = p.tailPh * 0.72 + i * 2.3;
    ctx.lineWidth = r * (i === 0 ? 0.30 : 0.23);
    ctx.beginPath();
    ctx.moveTo(-r * 0.42, -r * 0.26 * dir);
    for (let s = 1; s <= 4; s++) {
      const k = s / 4;
      const wx = -r * (0.5 + k * 1.75);
      const wy = -r * 0.26 * dir + Math.sin(ph - k * 2.6) * r * 0.6 * k + r * 0.3 * dir * k;
      ctx.lineTo(wx, wy);
    }
    ctx.stroke();
  }
  ctx.restore();

  /* 2. 尾鳍 */
  const wig = Math.sin(p.tailPh) * 0.30;
  const tailG = ctx.createLinearGradient(-r * 2.1, 0, -r * 0.6, 0);
  tailG.addColorStop(0, 'rgba(168,222,255,0.96)');
  tailG.addColorStop(1, 'rgba(96,166,236,0.98)');
  ctx.beginPath();
  ctx.moveTo(-r * 0.85, 0);
  ctx.quadraticCurveTo(-r * 1.5, (wig - 0.1) * r, -r * 2.05, (wig * 1.4 - 0.8) * r);
  ctx.quadraticCurveTo(-r * 1.45, wig * r * 0.5, -r * 2.05, (wig * 1.4 + 0.8) * r);
  ctx.quadraticCurveTo(-r * 1.5, (wig - 0.1) * r, -r * 0.85, 0);
  ctx.closePath();
  ctx.fillStyle = tailG;
  ctx.fill();

  /* 3. 背鳍 */
  ctx.beginPath();
  ctx.moveTo(-r * 0.34, -r * 0.82);
  ctx.quadraticCurveTo(-r * 0.62, -r * 1.52, -r * 0.10, -r * 1.02);
  ctx.quadraticCurveTo(0, -r * 0.9, r * 0.10, -r * 0.78);
  ctx.closePath();
  ctx.fillStyle = 'rgba(122,192,246,0.94)';
  ctx.fill();

  /* 4. 身体 */
  const bg = ctx.createLinearGradient(0, -r * 1.05, 0, r);
  bg.addColorStop(0, '#abe4ff');
  bg.addColorStop(0.38, '#6db7f3');
  bg.addColorStop(0.75, '#4a8fd9');
  bg.addColorStop(1, '#3a75c4');
  ctx.beginPath();
  ctx.ellipse(0, 0, r * 1.04, r * 0.96, 0, 0, TAU);
  ctx.fillStyle = bg;
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(r * 0.06, r * 0.46, r * 0.7, r * 0.4, 0, 0, TAU);
  ctx.fillStyle = 'rgba(228,247,255,0.3)';
  ctx.fill();

  // 胸鳍（身体后下方，别挡住脸）
  ctx.save();
  ctx.translate(-r * 0.42, r * 0.56);
  ctx.rotate(0.45 + Math.sin(p.tailPh * 0.9 + 1) * 0.2 + suck * 0.25);
  ctx.beginPath();
  ctx.ellipse(0, 0, r * 0.38, r * 0.17, 0, 0, TAU);
  ctx.fillStyle = 'rgba(150,214,252,0.85)';
  ctx.fill();
  ctx.restore();

  /* 5. 后层头发（给脑袋一圈边） */
  ctx.beginPath();
  ctx.ellipse(cx, cy - r * 0.05, hrx * 1.13, hry * 1.1, 0, 0, TAU);
  ctx.fillStyle = HAIR;
  ctx.fill();

  /* 6. 脸 */
  ctx.beginPath();
  ctx.ellipse(cx, cy + r * 0.02, hrx, hry, 0, 0, TAU);
  ctx.fillStyle = SKIN;
  ctx.fill();

  /* 7. 刘海 */
  ctx.beginPath();
  ctx.moveTo(cx - r * 0.70, cy + r * 0.02);
  ctx.bezierCurveTo(cx - r * 0.92, cy - r * 0.72, cx - r * 0.22, cy - r * 0.98, cx + r * 0.24, cy - r * 0.84);
  ctx.bezierCurveTo(cx + r * 0.66, cy - r * 0.72, cx + r * 0.82, cy - r * 0.38, cx + r * 0.64, cy - r * 0.06);
  ctx.quadraticCurveTo(cx + r * 0.54, cy - r * 0.26, cx + r * 0.38, cy - r * 0.04);
  ctx.quadraticCurveTo(cx + r * 0.26, cy - r * 0.26, cx + r * 0.06, cy - r * 0.02);
  ctx.quadraticCurveTo(cx - r * 0.10, cy - r * 0.26, cx - r * 0.30, cy + r * 0.04);
  ctx.quadraticCurveTo(cx - r * 0.48, cy - r * 0.18, cx - r * 0.70, cy + r * 0.02);
  ctx.closePath();
  ctx.fillStyle = HAIR;
  ctx.fill();

  // 发丝高光
  ctx.save();
  ctx.strokeStyle = 'rgba(190,228,255,0.6)';
  ctx.lineWidth = Math.max(1.4, r * 0.055);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(cx + r * 0.02, cy - r * 0.28, r * 0.46, Math.PI * 1.14, Math.PI * 1.52);
  ctx.stroke();
  ctx.restore();

  /* 8. 两侧鬓发 */
  ctx.fillStyle = HAIR_D;
  ctx.beginPath();
  ctx.moveTo(cx - r * 0.80, cy - r * 0.10);
  ctx.quadraticCurveTo(cx - r * 0.96, cy + r * 0.46, cx - r * 0.74, cy + r * 0.94);
  ctx.quadraticCurveTo(cx - r * 0.68, cy + r * 0.44, cx - r * 0.68, cy - r * 0.04);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx + r * 0.74, cy - r * 0.12);
  ctx.quadraticCurveTo(cx + r * 0.88, cy + r * 0.40, cx + r * 0.70, cy + r * 0.82);
  ctx.quadraticCurveTo(cx + r * 0.66, cy + r * 0.38, cx + r * 0.64, cy - r * 0.04);
  ctx.closePath();
  ctx.fill();

  /* 9. 眼睛 */
  const eyeY = cy + r * 0.17;
  const eyes = [[cx - r * 0.23, 1.0], [cx + r * 0.23, 0.94]];
  for (const [ex, sc] of eyes) {
    const w = r * 0.155 * sc, h = r * 0.185 * sc;
    if (blink > 0.55) {
      ctx.strokeStyle = '#22305e';
      ctx.lineWidth = Math.max(1.2, r * 0.045);
      ctx.beginPath();
      ctx.moveTo(ex - w, eyeY);
      ctx.quadraticCurveTo(ex, eyeY + h * 0.55, ex + w, eyeY);
      ctx.stroke();
    } else {
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(ex, eyeY, w, h * (1 - blink * 0.85), 0, 0, TAU);
      const eg = ctx.createLinearGradient(ex, eyeY - h, ex, eyeY + h);
      eg.addColorStop(0, '#1b2a58');
      eg.addColorStop(0.5, '#33549f');
      eg.addColorStop(1, '#7ba4e8');
      ctx.fillStyle = eg;
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(ex - w * 0.26, eyeY - h * 0.36, w * 0.36, h * 0.27, -0.3, 0, TAU);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(ex + w * 0.30, eyeY + h * 0.36, w * 0.17, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = '#182449';
      ctx.lineWidth = Math.max(1, r * 0.038);
      ctx.beginPath();
      ctx.ellipse(ex, eyeY, w * 1.02, h * 1.02, 0, Math.PI * 1.02, Math.PI * 1.98);
      ctx.stroke();
      ctx.restore();
    }
    // 腮红
    ctx.save();
    ctx.globalAlpha *= 0.4 + hurt * 0.35;
    ctx.fillStyle = hurt > 0.2 ? '#ff8f8f' : '#ffb1ba';
    ctx.beginPath();
    ctx.ellipse(ex + r * 0.06, eyeY + r * 0.22, r * 0.14, r * 0.075, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  /* 10. 嘴 */
  const mx = cx + r * 0.01, my = cy + r * 0.46;
  if (mouth > 0.12) {
    const mr = r * (0.085 + mouth * 0.05);
    ctx.beginPath();
    ctx.ellipse(mx, my, mr, mr * (0.62 + mouth * 0.5), 0, 0, TAU);
    ctx.fillStyle = '#a83c58';
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(mx, my + mr * 0.38, mr * 0.6, mr * 0.4, 0, 0, TAU);
    ctx.fillStyle = '#ff8fa8';
    ctx.fill();
  } else if (hurt > 0.25) {
    ctx.strokeStyle = '#c1596b';
    ctx.lineWidth = Math.max(1.1, r * 0.04);
    ctx.beginPath();
    ctx.arc(mx, my + r * 0.05, r * 0.075, Math.PI * 0.1, Math.PI * 0.9);
    ctx.stroke();
  } else {
    ctx.strokeStyle = '#cf6377';
    ctx.lineWidth = Math.max(1.1, r * 0.042);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(mx - r * 0.085, my - r * 0.01);
    ctx.quadraticCurveTo(mx, my + r * 0.08, mx + r * 0.1, my - r * 0.025);
    ctx.stroke();
  }

  /* 12. 边缘光 */
  ctx.save();
  ctx.strokeStyle = 'rgba(228,250,255,0.55)';
  ctx.lineWidth = Math.max(1, r * 0.045);
  ctx.beginPath();
  ctx.ellipse(0, 0, r * 1.02, r * 0.94, 0, Math.PI * 1.1, Math.PI * 1.9);
  ctx.stroke();
  ctx.restore();

  ctx.restore();

  /* 吃到东西的光晕 */
  if (p.eatGlow > 0) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const gg = ctx.createRadialGradient(p.x, p.y, r * 0.4, p.x, p.y, r * 2.3);
    gg.addColorStop(0, `rgba(190,240,255,${0.22 * p.eatGlow})`);
    gg.addColorStop(1, 'rgba(190,240,255,0)');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r * 2.3, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
}

/* ---- 吸气特效 ---- */
function drawSuckFX(p) {
  if (p.suckVis < 0.05 || !Input.sucking) return;
  const R = suckR();
  const t = G.time;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  // 向嘴部收拢的水流
  for (let i = 0; i < 26; i++) {
    const a = (i / 26) * TAU + t * 0.9 + Math.sin(i * 2.7) * 0.2;
    const ph = (t * 2.1 + i * 0.37) % 1;
    const dOuter = R * (1 - ph * 0.9);
    const len = R * (0.1 + 0.12 * (1 - ph));
    const x0 = p.x + Math.cos(a) * dOuter;
    const y0 = p.y + Math.sin(a) * dOuter;
    const x1 = p.x + Math.cos(a) * Math.max(4, dOuter - len);
    const y1 = p.y + Math.sin(a) * Math.max(4, dOuter - len);
    const al = (1 - ph) * 0.3 * p.suckVis;
    if (al <= 0.01) continue;
    const g = ctx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, `rgba(170,235,255,0)`);
    g.addColorStop(0.6, `rgba(190,245,255,${al})`);
    g.addColorStop(1, `rgba(230,255,255,${al * 1.4})`);
    ctx.strokeStyle = g;
    ctx.lineWidth = 1.6 + 1.4 * (1 - ph);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
  }

  // 嘴边的光
  const rg = ctx.createRadialGradient(p.x, p.y, p.r * 0.2, p.x, p.y, R * 0.55);
  rg.addColorStop(0, `rgba(200,245,255,${0.1 * p.suckVis})`);
  rg.addColorStop(1, 'rgba(200,245,255,0)');
  ctx.fillStyle = rg;
  ctx.beginPath();
  ctx.arc(p.x, p.y, R * 0.55, 0, TAU);
  ctx.fill();
  ctx.restore();
}

/* ══════════════ 绘制：生物 ══════════════ */
function drawFood(it) {
  const t = G.time;
  ctx.save();
  ctx.translate(it.x, it.y);
  if (it.id === 'plankton') {
    ctx.globalCompositeOperation = 'lighter';
    const a = 0.5 + 0.3 * Math.sin(t * 3 + it.ph);
    ctx.fillStyle = `rgba(190,245,255,${a})`;
    ctx.beginPath();
    ctx.arc(0, 0, it.r * 0.9, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(-it.r * 0.2, -it.r * 0.2, it.r * 0.36, 0, TAU);
    ctx.fill();
  } else if (it.id === 'shrimp') {
    ctx.rotate(Math.atan2(it.vy, it.vx) * 0.5 + Math.sin(t * 3 + it.ph) * 0.2);
    const g = ctx.createLinearGradient(-it.r, 0, it.r, 0);
    g.addColorStop(0, '#ff8f7a');
    g.addColorStop(1, '#ffc6ab');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, 0, it.r * 1.05, it.r * 0.62, 0, 0, TAU);
    ctx.fill();
    // 尾巴
    ctx.beginPath();
    ctx.moveTo(-it.r * 0.95, 0);
    ctx.lineTo(-it.r * 1.6, -it.r * 0.5);
    ctx.lineTo(-it.r * 1.45, it.r * 0.1);
    ctx.closePath();
    ctx.fill();
    // 眼
    ctx.fillStyle = '#4a2035';
    ctx.beginPath();
    ctx.arc(it.r * 0.62, -it.r * 0.12, it.r * 0.16, 0, TAU);
    ctx.fill();
  } else if (it.id === 'fish') {
    const ang = Math.atan2(it.vy, it.vx);
    ctx.rotate(ang + Math.sin(t * 4 + it.ph) * 0.1);
    const wag = Math.sin(t * 9 + it.ph) * 0.5;
    ctx.fillStyle = '#ffcb5e';
    // 尾
    ctx.beginPath();
    ctx.moveTo(-it.r * 0.8, 0);
    ctx.lineTo(-it.r * 1.6, -it.r * 0.55 + wag * it.r * 0.3);
    ctx.lineTo(-it.r * 1.6, it.r * 0.55 + wag * it.r * 0.3);
    ctx.closePath();
    ctx.fill();
    // 身体
    const g = ctx.createLinearGradient(0, -it.r, 0, it.r);
    g.addColorStop(0, '#ffe08a');
    g.addColorStop(1, '#f5a63a');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, 0, it.r * 1.22, it.r * 0.78, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.ellipse(-it.r * 0.1, it.r * 0.24, it.r * 0.62, it.r * 0.26, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#3a2410';
    ctx.beginPath();
    ctx.arc(it.r * 0.66, -it.r * 0.14, it.r * 0.13, 0, TAU);
    ctx.fill();
  } else if (it.id === 'pearl') {
    const pulse = 0.75 + 0.25 * Math.sin(t * 4 + it.ph);
    ctx.globalCompositeOperation = 'lighter';
    const gg = ctx.createRadialGradient(0, 0, 1, 0, 0, it.r * 3.2 * pulse);
    gg.addColorStop(0, 'rgba(255,246,205,0.75)');
    gg.addColorStop(0.5, 'rgba(255,225,150,0.25)');
    gg.addColorStop(1, 'rgba(255,220,140,0)');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.arc(0, 0, it.r * 3.2 * pulse, 0, TAU);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    const pg = ctx.createRadialGradient(-it.r * 0.3, -it.r * 0.3, 1, 0, 0, it.r * 1.1);
    pg.addColorStop(0, '#ffffff');
    pg.addColorStop(0.6, '#fff1c9');
    pg.addColorStop(1, '#e8c98a');
    ctx.fillStyle = pg;
    ctx.beginPath();
    ctx.arc(0, 0, it.r * 1.05, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function drawJelly(it) {
  const t = G.time;
  const pulse = Math.sin(t * 2.2 + (it.ph || 0));
  const r = it.r;
  ctx.save();
  ctx.translate(it.x, it.y);
  ctx.globalCompositeOperation = 'lighter';
  const glow = ctx.createRadialGradient(0, 0, 1, 0, 0, r * 2.4);
  glow.addColorStop(0, 'rgba(255,150,235,0.34)');
  glow.addColorStop(1, 'rgba(255,150,235,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(0, 0, r * 2.4, 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  // 触手
  ctx.strokeStyle = 'rgba(255,190,245,0.62)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 6; i++) {
    const ox = (i / 5 - 0.5) * r * 1.3;
    ctx.beginPath();
    ctx.moveTo(ox, r * 0.2);
    for (let s = 1; s <= 3; s++) {
      const k = s / 3;
      ctx.lineTo(ox + Math.sin(t * 2.6 + i + k * 2.4) * r * 0.22 * k, r * (0.2 + k * 1.25));
    }
    ctx.stroke();
  }
  // 伞盖
  const g = ctx.createLinearGradient(0, -r, 0, r * 0.4);
  g.addColorStop(0, 'rgba(255,215,250,0.95)');
  g.addColorStop(1, 'rgba(226,140,240,0.7)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(0, 0, r * (1 + pulse * 0.05), r * (0.86 - pulse * 0.05), 0, Math.PI, 0);
  ctx.quadraticCurveTo(r * 0.6, r * 0.34, 0, r * 0.26);
  ctx.quadraticCurveTo(-r * 0.6, r * 0.34, -r, 0);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,240,255,0.55)';
  ctx.lineWidth = 1.4;
  ctx.stroke();
  ctx.restore();
}

function drawBigFish(it) {
  const r = it.r;
  const ang = it.dir == null ? Math.atan2(it.vy, it.vx) : it.dir;
  const t = G.time;
  ctx.save();
  ctx.translate(it.x, it.y);
  ctx.rotate(ang);
  const wag = Math.sin(t * 5 + (it.ph || 0)) * 0.28;
  const body = it.id === 'angler' ? '#2b1f4d' : '#3b3f7a';
  const lite = it.id === 'angler' ? '#584080' : '#5b62a8';

  // 尾
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.moveTo(-r * 0.8, 0);
  ctx.lineTo(-r * 1.9, -r * 0.75 + wag * r * 0.45);
  ctx.lineTo(-r * 1.55, 0);
  ctx.lineTo(-r * 1.9, r * 0.75 + wag * r * 0.45);
  ctx.closePath();
  ctx.fill();

  const g = ctx.createLinearGradient(0, -r, 0, r);
  g.addColorStop(0, lite);
  g.addColorStop(1, body);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(0, 0, r * 1.35, r * 0.92, 0, 0, TAU);
  ctx.fill();
  // 背鳍
  ctx.beginPath();
  ctx.moveTo(-r * 0.2, -r * 0.85);
  ctx.lineTo(-r * 0.7, -r * 1.5);
  ctx.lineTo(-r * 1.05, -r * 0.8);
  ctx.closePath();
  ctx.fill();
  // 眼
  ctx.fillStyle = '#ffe9a0';
  ctx.beginPath();
  ctx.arc(r * 0.62, -r * 0.2, r * 0.2, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#1a1020';
  ctx.beginPath();
  ctx.arc(r * 0.68, -r * 0.2, r * 0.1, 0, TAU);
  ctx.fill();
  // 嘴 + 牙
  ctx.fillStyle = '#150d22';
  ctx.beginPath();
  ctx.moveTo(r * 1.25, -r * 0.05);
  ctx.quadraticCurveTo(r * 1.02, r * 0.34, r * 1.22, r * 0.36);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#f6f2ff';
  for (let i = 0; i < 4; i++) {
    const x = r * (0.95 + i * 0.09);
    ctx.beginPath();
    ctx.moveTo(x, r * 0.02);
    ctx.lineTo(x + r * 0.06, r * 0.16);
    ctx.lineTo(x + r * 0.12, r * 0.02);
    ctx.closePath();
    ctx.fill();
  }
  // 灯笼鱼的灯
  if (it.id === 'angler') {
    const lx = r * 1.1, ly = -r * 1.05;
    ctx.strokeStyle = '#4a3670';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(r * 0.7, -r * 0.8);
    ctx.quadraticCurveTo(r * 1.5, -r * 1.5, lx, ly);
    ctx.stroke();
    const l = 0.7 + 0.3 * Math.sin(t * 4);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const lg = ctx.createRadialGradient(lx, ly, 1, lx, ly, r * 1.5 * l);
    lg.addColorStop(0, 'rgba(190,255,180,0.85)');
    lg.addColorStop(0.4, 'rgba(140,255,170,0.28)');
    lg.addColorStop(1, 'rgba(140,255,170,0)');
    ctx.fillStyle = lg;
    ctx.beginPath(); ctx.arc(lx, ly, r * 1.5 * l, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#eaffd8';
    ctx.beginPath(); ctx.arc(lx, ly, r * 0.16, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawNet(it) {
  const r = it.r;
  const t = G.time;
  const sway = Math.sin(it.age * 1.15) * 0.07;

  // 绳子（从水面垂下来）
  ctx.save();
  ctx.strokeStyle = 'rgba(205,225,238,0.45)';
  ctx.lineWidth = Math.max(1.6, r * 0.075);
  ctx.beginPath();
  ctx.moveTo(it.x + r * 0.9, 0);
  ctx.quadraticCurveTo(it.x + r * 0.35, it.y * 0.5, it.x, it.y - r * 0.85);
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.translate(it.x, it.y);
  ctx.rotate(sway);

  const topW = r * 1.0, botW = r * 0.48, hgt = r * 2.0;

  // 网兜
  ctx.beginPath();
  ctx.moveTo(-topW, 0);
  ctx.quadraticCurveTo(-topW * 0.6, hgt * 0.8, -botW, hgt);
  ctx.quadraticCurveTo(0, hgt * 1.12, botW, hgt);
  ctx.quadraticCurveTo(topW * 0.6, hgt * 0.8, topW, 0);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, 0, 0, hgt);
  g.addColorStop(0, 'rgba(190,220,238,0.30)');
  g.addColorStop(1, 'rgba(120,170,205,0.16)');
  ctx.fillStyle = g;
  ctx.fill();

  // 网格：竖线
  ctx.strokeStyle = 'rgba(210,238,250,0.4)';
  ctx.lineWidth = Math.max(1, r * 0.05);
  for (let i = 0; i <= 6; i++) {
    const k = i / 6;
    const x0 = -topW + k * topW * 2;
    const x1 = x0 * 0.5;
    ctx.beginPath();
    ctx.moveTo(x0, 0);
    ctx.quadraticCurveTo(x0 * 0.72, hgt * 0.72, x1, hgt);
    ctx.stroke();
  }
  // 网格：横线（下垂的弧）
  for (let j = 1; j <= 3; j++) {
    const k = j / 4;
    const halfW = lerp(topW, botW * 1.1, k);
    const y = hgt * k * 1.02;
    const sag = hgt * 0.1 * (1 - k * 0.5);
    ctx.beginPath();
    ctx.moveTo(-halfW, y);
    ctx.quadraticCurveTo(0, y + sag, halfW, y);
    ctx.stroke();
  }

  // 上沿浮球 + 横杆
  ctx.strokeStyle = 'rgba(235,248,255,0.6)';
  ctx.lineWidth = Math.max(1.6, r * 0.09);
  ctx.beginPath();
  ctx.moveTo(-topW, 0);
  ctx.quadraticCurveTo(0, -r * 0.12, topW, 0);
  ctx.stroke();
  for (let i = -3; i <= 3; i++) {
    const x = (i / 3) * topW * 0.92;
    ctx.fillStyle = 'rgba(255,236,180,0.75)';
    ctx.beginPath();
    ctx.arc(x, -r * 0.1 + Math.cos((i / 3) * 1.2) * r * 0.05, r * 0.075, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

/* ══════════════ 绘制：HUD ══════════════ */
function heartPath(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.32);
  ctx.bezierCurveTo(x - s * 1.15, y - s * 0.5, x - s * 0.5, y - s * 1.3, x, y - s * 0.56);
  ctx.bezierCurveTo(x + s * 0.5, y - s * 1.3, x + s * 1.15, y - s * 0.5, x, y + s * 0.32);
  ctx.closePath();
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawHUD() {
  const u = UI;
  const pad = 18 * u;

  ctx.save();
  ctx.textBaseline = 'alphabetic';

  // 体重
  const wTxt = G.weight.toFixed(1);
  ctx.font = `800 ${Math.round(38 * u)}px "PingFang SC","Microsoft YaHei",sans-serif`;
  const wW = ctx.measureText(wTxt).width;
  ctx.fillStyle = 'rgba(0,10,25,0.34)';
  ctx.fillText(wTxt, pad + 1.5, pad + 34 * u + 1.5);
  const wg = ctx.createLinearGradient(0, pad, 0, pad + 34 * u);
  wg.addColorStop(0, '#ffffff');
  wg.addColorStop(1, '#a5e0ff');
  ctx.fillStyle = wg;
  ctx.fillText(wTxt, pad, pad + 34 * u);
  ctx.font = `700 ${Math.round(15 * u)}px "PingFang SC",sans-serif`;
  ctx.fillStyle = '#8fc7e4';
  ctx.fillText('kg', pad + wW + 5 * u, pad + 33 * u);

  // 标签
  ctx.font = `600 ${Math.round(11.5 * u)}px "PingFang SC",sans-serif`;
  ctx.fillStyle = 'rgba(150,205,235,0.72)';
  ctx.fillText('大肥鱼体重', pad + 1, pad + 52 * u);

  // 深度
  ctx.font = `700 ${Math.round(13 * u)}px "PingFang SC",sans-serif`;
  ctx.fillStyle = 'rgba(160,215,245,0.86)';
  ctx.fillText(`深度 ${Math.round(G.depthMax)} m`, pad + 1, pad + 74 * u);

  // 心
  const hr = 8.5 * u;
  for (let i = 0; i < G.maxHp; i++) {
    const x = pad + 8 * u + i * (hr * 2.9), y = pad + 74 * u + hr * 2.3 + 14 * u;
    heartPath(x, y, hr);
    if (i < G.hp) {
      const hg = ctx.createLinearGradient(x, y - hr, x, y + hr);
      hg.addColorStop(0, '#ff9db5');
      hg.addColorStop(1, '#e8506e');
      ctx.fillStyle = hg;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,220,230,0.7)';
      ctx.lineWidth = 1;
      ctx.stroke();
    } else {
      ctx.strokeStyle = 'rgba(255,255,255,0.24)';
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }
  }

  // 连击
  if (G.combo > 1) {
    const a = clamp(G.comboT / 2.4, 0, 1);
    const s = 1 + Math.sin(G.time * 12) * 0.02;
    const txt = `连吃 ×${G.combo}`;
    ctx.font = `800 ${Math.round(17 * u)}px "PingFang SC",sans-serif`;
    const tw = ctx.measureText(txt).width;
    const cx = W / 2, cy = pad + 20 * u;
    ctx.save();
    ctx.globalAlpha = 0.55 + a * 0.45;
    ctx.translate(cx, cy);
    ctx.scale(s, s);
    roundRect(-tw / 2 - 14 * u, -16 * u, tw + 28 * u, 30 * u, 15 * u);
    ctx.fillStyle = 'rgba(255,180,60,0.16)';
    ctx.fill();
    ctx.strokeStyle = `rgba(255,205,120,${0.35 + a * 0.35})`;
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.fillStyle = '#ffd98a';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(txt, 0, 1);
    ctx.restore();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }

  // 吐司
  let ty = pad + 96 * u;
  for (const t of G.toasts) {
    const a = clamp(t.life / 0.6, 0, 1) * clamp((t.max - t.life) / 0.25, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = `700 ${Math.round(13 * u)}px "PingFang SC",sans-serif`;
    ctx.textAlign = 'center';
    const tw = ctx.measureText(t.txt).width;
    roundRect(W / 2 - tw / 2 - 13 * u, ty - 14 * u, tw + 26 * u, 24 * u, 12 * u);
    ctx.fillStyle = 'rgba(10,30,50,0.55)';
    ctx.fill();
    ctx.fillStyle = t.color;
    ctx.fillText(t.txt, W / 2, ty + 3 * u);
    ctx.restore();
    ty += 30 * u;
  }
  ctx.textAlign = 'left';

  // 吸气提示（前 6 秒）
  if (G.time < 7 && G.state === 'play') {
    const a = clamp((7 - G.time) / 2, 0, 1) * 0.8;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = `600 ${Math.round(13 * u)}px "PingFang SC",sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#a9e4ff';
    ctx.fillText('按住屏幕 / 空格 张嘴吸小鱼', W / 2, H - 34 * u);
    ctx.restore();
  }
  ctx.restore();
}

/* ══════════════ 主渲染 ══════════════ */
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.save();
  if (G.shake > 0.2) {
    const s = G.shake;
    ctx.translate(rand(-s, s) * 0.5, rand(-s, s) * 0.5);
  }

  drawBackground();
  drawSnow();

  const p = G.player;
  if (p) {
    // 生物（食物在下，危险在上）
    for (const it of G.items) {
      if (it.kind === 'food') {
        ctx.globalAlpha = it.suck > 0 ? 1 : 1;
        drawFood(it);
        ctx.globalAlpha = 1;
      }
    }
    drawBubbles();
    drawSuckFX(p);
    drawDafeiyu(p);

    for (const it of G.items) {
      if (it.kind === 'hazard') {
        if (it.id === 'jelly') drawJelly(it);
        else if (it.id === 'net') drawNet(it);
        else drawBigFish(it);
      }
    }

    // 粒子
    for (const q of G.parts) {
      const a = clamp(q.life / q.max, 0, 1);
      ctx.globalAlpha = a;
      ctx.fillStyle = q.color;
      ctx.beginPath();
      ctx.arc(q.x, q.y, q.r * (0.4 + a * 0.6), 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 浮动文字
    for (const t of G.texts) {
      const a = clamp(t.life / t.max, 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.font = `800 ${Math.round(t.size * UI)}px "PingFang SC",sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(0,12,28,0.5)';
      ctx.fillText(t.txt, t.x + 1, t.y + 1);
      ctx.fillStyle = t.color;
      ctx.fillText(t.txt, t.x, t.y);
      ctx.restore();
    }

    if (G.state === 'play' || G.state === 'paused') drawHUD();

    // 受伤红边
    if (G.hp === 1 && G.state === 'play') {
      const a = 0.18 + 0.1 * Math.sin(G.time * 5);
      const rg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.34, W / 2, H / 2, Math.max(W, H) * 0.72);
      rg.addColorStop(0, 'rgba(255,60,90,0)');
      rg.addColorStop(1, `rgba(255,50,90,${a})`);
      ctx.fillStyle = rg;
      ctx.fillRect(0, 0, W, H);
    }
  }

  ctx.restore();

  // 闪光
  if (G.flash > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(G.flash * 0.8, 0, 0.85);
    const fg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.8);
    fg.addColorStop(0, 'rgba(255,255,255,0.5)');
    fg.addColorStop(0.5, 'rgba(180,230,255,0.16)');
    fg.addColorStop(1, 'rgba(120,200,255,0)');
    ctx.fillStyle = fg;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  // 暗角
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,4,12,0.52)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

/* ══════════════ 循环 ══════════════ */
let lastT = 0;
let rafId = 0;
function loop(ts) {
  rafId = requestAnimationFrame(loop);
  if (!lastT) lastT = ts;
  let dt = (ts - lastT) / 1000;
  lastT = ts;
  dt = Math.min(dt, 0.05);

  if (G.state === 'play') {
    let sdt = dt;
    if (G.hitStop > 0) {
      G.hitStop -= dt;
      sdt = dt * 0.22;
    }
    update(sdt);
  } else if (G.state === 'paused') {
    // 冻结
  } else {
    // 开始/结束界面：背景仍然流动，鱼轻轻漂
    G.time += dt;
    for (const s of G.snow) {
      s.y -= s.sp * dt;
      s.x += Math.sin(G.time * 0.5 + s.ph) * 4 * dt;
      if (s.y < -6) { s.y = H + 6; s.x = Math.random() * W; }
    }
    for (const b of G.bubbles) {
      b.y -= b.sp * dt;
      b.x += Math.sin(G.time * 2 + b.wob) * 10 * dt;
      if (b.y < -10) { b.y = H + 8; b.x = Math.random() * W; }
    }
    if (G.player) {
      const p = G.player;
      p.x = W / 2 + Math.sin(G.time * 0.6) * 26;
      p.y = H * 0.56 + Math.cos(G.time * 0.78) * 16;
      p.vx = Math.cos(G.time * 0.6) * 16;
      p.vy = -Math.sin(G.time * 0.78) * 12;
      p.tailPh += dt * 3.4;
      p.facing = 1;
      p.tilt = Math.sin(G.time * 0.5) * 0.06;
      p.r = lerp(p.r, radiusFor(G.weight), dt * 3);
      p.blinkTimer -= dt;
      if (p.blinkTimer <= 0) { p.blink = 1; p.blinkTimer = rand(2.5, 6); }
      if (p.blink > 0) p.blink = Math.max(0, p.blink - dt * 6);
    }
  }
  render();
}

/* ══════════════ 界面流程 ══════════════ */
const elStart = document.getElementById('start');
const elOver = document.getElementById('over');
const elPaused = document.getElementById('paused');
const elBest = document.getElementById('bestTxt');

function show(el, on) {
  el.classList.toggle('hidden', !on);
}

function refreshBest() {
  elBest.textContent = G.best > 0 ? G.best.toFixed(1) + ' kg' : '—';
}

function startGame() {
  Sound.init(); Sound.resume(); Sound.stopSuck();
  Input.sucking = false;
  resetGame();
  G.state = 'play';
  show(elStart, false);
  show(elOver, false);
  show(elPaused, false);
  lastT = 0;
}

function gameOver() {
  G.state = 'over';
  Sound.stopSuck();
  Sound.over();
  G.flash = 0.6;
  G.shake = 20;

  const isRec = saveBest(G.peakW);
  refreshBest();

  document.getElementById('overTitle').textContent = isRec ? '新纪录！大肥鱼撑到了' : '撑不住了';
  const subs = [
    '在大海里，胖是一种罪，也是一种荣誉',
    '你吞下的每一条小鱼，都变成了你的肉',
    '海底很安静，只有你打嗝的声音',
    '大肥鱼圆滚滚地沉了下去，没有遗憾'
  ];
  document.getElementById('overSub').textContent = pick(subs);
  document.getElementById('sWeight').textContent = G.peakW.toFixed(1);
  document.getElementById('sDepth').textContent = Math.round(G.depthMax);
  document.getElementById('sEat').textContent = G.eaten;
  const sb = document.getElementById('sBest');
  sb.textContent = G.best.toFixed(1) + ' kg';
  sb.classList.toggle('rec', isRec);

  setTimeout(() => { if (G.state === 'over') show(elOver, true); }, 520);
}

function togglePause() {
  if (G.state === 'play') {
    G.state = 'paused';
    Sound.stopSuck();
    Input.sucking = false;
    show(elPaused, true);
  } else if (G.state === 'paused') {
    G.state = 'play';
    show(elPaused, false);
    lastT = 0;
  }
}

function resumeGame() { if (G.state === 'paused') togglePause(); }

document.getElementById('btnStart').addEventListener('click', startGame);
document.getElementById('btnAgain').addEventListener('click', startGame);
document.getElementById('btnResume').addEventListener('click', resumeGame);
document.getElementById('btnPause').addEventListener('click', togglePause);

const btnSound = document.getElementById('btnSound');
function refreshSoundBtn() {
  btnSound.textContent = Sound.on ? '♪' : '♪';
  btnSound.classList.toggle('off', !Sound.on);
}
btnSound.addEventListener('click', () => {
  Sound.init();
  Sound.on = !Sound.on;
  if (!Sound.on) Sound.stopSuck();
  refreshSoundBtn();
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden && G.state === 'play') togglePause();
});

/* ---- 启动 ---- */
loadBest();
refreshBest();
if (AVATAR && AVATAR.indexOf('data:') === 0) {
  document.getElementById('ava').src = AVATAR;
  document.getElementById('ava2').src = AVATAR;
}
resize();
resetGame();
G.state = 'start';
refreshSoundBtn();
rafId = requestAnimationFrame(loop);

})();
</script>
</body>
</html>
